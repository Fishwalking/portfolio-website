<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151513">
    <title>온세미로 상세페이지 · 이준석 포트폴리오</title>
    <link rel="stylesheet" href="css/onsemiro.css">
    <script defer src="js/onsemiro-reader.js"></script>
  </head>
  <body>
    <a class="skip" href="#brand">작품으로 건너뛰기</a>
    <div class="reader">
      <aside class="rail" aria-label="작품 탐색">
        <a class="back" href="index.html#onsemiro">포트폴리오로</a>
        <div class="rail-title">
          <h1>온세미로</h1>
          <p>위스키 브랜드 상세페이지</p>
        </div>
        <nav class="chapters" aria-label="상세페이지 목차">
          <a href="#brand" aria-current="location">브랜드</a>
          <a href="#craft">원료와 풍미</a>
          <a href="#gallery">화보</a>
          <a href="#gift">선물함</a>
          <a href="#products">제품 정보</a>
        </nav>
        <button class="motion" type="button" hidden>움직임 멈추기</button>
      </aside>
      <main class="work" aria-label="온세미로 상세페이지 디자인">
        <section id="brand" aria-label="브랜드 이야기와 두 가지 위스키">
          <img src="img/onsemiro/hero.webp" width="960" height="3337" fetchpriority="high" alt="온세미로. 자연 그대로, 시간을 빚다. 이끼와 돌 위에 놓인 위스키 병과 잔.">
          <img src="img/onsemiro/collection.webp" width="960" height="2565" loading="lazy" alt="오크통에서 최소 3년 숙성한 온세미로 클래식과 최소 7년 숙성한 청담.">
          <picture class="motion-image">
            <source data-still media="(prefers-reduced-motion: reduce)" srcset="img/onsemiro/bottle-still.webp">
            <source type="image/webp" srcset="img/onsemiro/bottle-motion.webp">
            <img src="img/위스키-목.gif" width="1080" height="1920" loading="lazy" alt="검은 배경에서 빛을 받으며 드러나는 병마개와 KOREAN WHISKY 글자.">
          </picture>
        </section>
        <section id="craft" aria-label="제조 과정과 테이스팅 노트">
          <img src="img/onsemiro/craft.webp" width="960" height="4645" loading="lazy" alt="한 방울에 담긴 기다림의 기록. 국산 곡물을 선별하고 오크통에서 숙성한 뒤 블렌딩합니다.">
          <div class="rice">
            <picture class="motion-image">
              <source data-still media="(prefers-reduced-motion: reduce)" srcset="img/onsemiro/rice-still.webp">
              <source type="image/webp" srcset="img/onsemiro/rice-motion.webp">
              <img src="img/쌀.gif" width="512" height="768" loading="lazy" alt="떨어지는 쌀알이 나무 바닥에 쌓이는 장면.">
            </picture>
          </div>
          <img src="img/onsemiro/tasting.webp" width="960" height="1417" loading="lazy" alt="테이스팅 노트. 볶은 곡물과 바닐라 향, 캐러멜을 닮은 단맛과 오크의 여운.">
          <div class="serving">
            <img src="img/onsemiro/serving.webp" width="960" height="2354" loading="lazy" alt="병을 열고 시간이 지나면서 변화하는 향, 온더락과 하이볼로 마시는 방법.">
            <picture class="motion-image clock">
              <source data-still media="(prefers-reduced-motion: reduce)" srcset="img/onsemiro/time-still.webp">
              <source type="image/webp" srcset="img/onsemiro/time-motion.webp">
              <img src="img/time.gif" width="500" height="500" loading="lazy" alt="병을 연 후의 경과 시간.">
            </picture>
          </div>
        </section>
        <section id="gallery" aria-label="온세미로의 두 장면">
          <img src="img/onsemiro/gallery.webp" width="960" height="3423" loading="lazy" alt="인물 화보 두 장. 햇살이 비치는 벽 앞에서 병을 든 모습과 유리 테이블 위로 병이 비치는 모습.">
        </section>
        <section id="gift" aria-label="선물 패키지">
          <img src="img/onsemiro/gift.webp" width="960" height="3500" loading="lazy" alt="학 문양이 새겨진 검은 선물함. 두 문을 열면 위스키와 잔이 보이고, 문 안쪽에는 학과 대문 그림이 펼쳐집니다.">
        </section>
        <section id="products" aria-label="클래식과 청담 제품 정보">
          <img src="img/onsemiro/classic.webp" width="960" height="959" loading="lazy" alt="온세미로 클래식. 오크통 최소 3년 숙성. 도수 31%, 용량 300mL.">
          <img src="img/onsemiro/classic-specs.webp" width="960" height="645" loading="lazy" alt="온세미로 클래식 제품 정보표. 원료, 용량, 포장 재질과 제조 정보를 담았습니다.">
          <img src="img/onsemiro/cheongdam.webp" width="960" height="1181" loading="lazy" alt="온세미로 청담. 오크통 최소 7년 숙성. 도수 40%, 용량 300mL.">
          <img src="img/onsemiro/cheongdam-specs.webp" width="960" height="749" loading="lazy" alt="온세미로 청담 제품 정보표. 원료, 용량, 포장 재질과 제조 정보를 담았습니다.">
          <img src="img/onsemiro/service.webp" width="960" height="3024" loading="lazy" alt="배송과 교환·반품 안내 디자인. 마지막 장면에 온세미로 로고가 보입니다.">
        </section>
        <footer><a href="index.html#onsemiro">포트폴리오로 돌아가기</a><a href="#brand">맨 위로</a></footer>
      </main>
    </div>
  </body>
</html>
